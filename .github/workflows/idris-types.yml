name: Idris type model

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    container: ghcr.io/stefan-hoeck/idris2-pack@sha256:b09b2c28f3c5857650ea3d366caf37ac99380c12a6a6cf65ea037da4023f70c3
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select tested Idris2 package collection
        run: pack switch nightly-260814

      - name: Build type model
        run: idris2 --build types/mock-theta-types.ipkg

      - name: Run executable examples
        run: ./types/build/exec/mock-theta-types
