name: Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - "ci/build-toolchain.tsv"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "ci/build-toolchain.tsv"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - name: Check out canonical Android packager
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/android-NDK
          ref: 7c61ee43e75f7c2dab9288edb0e10055898b36e6
          path: .android-ndk

      - name: Check out central signing registry
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/ai-ci
          ref: 899cd561cf4c8e8654ee1466c0b3eaff1636a25c
          path: .signing-policy
          sparse-checkout: android-signing/identities.tsv
          sparse-checkout-cone-mode: false

      - name: Load registered Mock Theta test signer
        shell: bash
        run: |
          set -Eeuo pipefail
          registry=.signing-policy/android-signing/identities.tsv
          signer=$(
            awk -F '\t'               '$1 == "org.isomorphisms.mocktheta" && $2 == "test" { print $3 }'               "$registry"
          )
          count=$(printf '%s\n' "$signer" | sed '/^$/d' | wc -l)
          [[ $count -eq 1 ]] || {
            echo "Mock Theta test signer registry entry count is $count" >&2
            exit 1
          }
          printf 'ANDROID_EXPECTED_CERT_SHA256=%s\n' "$signer" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build inputs
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.14206865"

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_ABI: armeabi-v7a
          ANDROID_API: "21"
        run: |
          bash android/build-native.sh             build/android/armeabi-v7a/libmocktheta.so

      - name: Package signed NativeActivity APK
        env:
          ANDROID_PACKAGE_ID: org.isomorphisms.mocktheta
          ANDROID_VERSION_CODE: "1"
          ANDROID_VERSION_NAME: "0.1.0"
          ANDROID_MIN_SDK: "21"
          ANDROID_TARGET_SDK: "36"
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          ANDROID_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_KEY_ALIAS: wegert-debug
          ANDROID_STORE_PASSWORD: wegert-debug
          ANDROID_KEY_PASSWORD: wegert-debug
          ANDROID_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash .android-ndk/apk/build-nativeactivity-apk.sh             android/AndroidManifest.xml             build/android/armeabi-v7a/libmocktheta.so             armeabi-v7a             build/android/mock-theta-armeabi-v7a.apk

      - name: Mandatory Android producer gate
        uses: isomorphisms/ai-ci/android-producer@899cd561cf4c8e8654ee1466c0b3eaff1636a25c
        with:
          apk: build/android/mock-theta-armeabi-v7a.apk
          root: .
          packager-receipt: build/android/mock-theta-armeabi-v7a.receipt.tsv
          packager-root: .android-ndk
          expected-abi: armeabi-v7a
          lane: test
          require-no-dex: "true"
          receipt-output: build/android/mock-theta-armeabi-v7a.producer.tsv

      - name: Record APK contents
        run: |
          unzip -l build/android/mock-theta-armeabi-v7a.apk             > build/android/mock-theta-armeabi-v7a.contents.txt
          sha256sum build/android/mock-theta-armeabi-v7a.apk             > build/android/mock-theta-armeabi-v7a.sha256
          grep -Fq "lib/armeabi-v7a/libmocktheta.so"             build/android/mock-theta-armeabi-v7a.contents.txt
          ! grep -Eq "classes[0-9]*\.dex"             build/android/mock-theta-armeabi-v7a.contents.txt

      - name: Retain first phone APK
        uses: actions/upload-artifact@v4
        with:
          name: mock-theta-first-apk
          path: |
            build/android/mock-theta-armeabi-v7a.apk
            build/android/mock-theta-armeabi-v7a.receipt.tsv
            build/android/mock-theta-armeabi-v7a.producer.tsv
            build/android/mock-theta-armeabi-v7a.contents.txt
            build/android/mock-theta-armeabi-v7a.sha256
          if-no-files-found: error
